# Tests, formatting and FAP build, shared by ci.yml, nightly.yml and
# release.yml. The FAP is uploaded as the `flipper_diver` artifact.
name: Build

on:
  workflow_call:
    outputs:
      sdk-version:
        description: Version du SDK (firmware officiel, canal release)
        value: ${{ jobs.build.outputs.sdk-version }}
      api-version:
        description: Version de l'API du SDK
        value: ${{ jobs.build.outputs.api-version }}

permissions:
  contents: read

jobs:
  build:
    name: Tests et build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sdk-version: ${{ steps.sdk.outputs.sdk-version }}
      api-version: ${{ steps.sdk.outputs.api-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # clang-format pinned to the version of the devenv shell: another
      # version may format differently.
      - name: Installe ufbt et clang-format
        run: pip install -r requirements.txt clang-format==21.1.8

      - name: Tests unitaires (ASan, UBSan)
        run: bash tools/unit-tests.sh

      - name: Formatage
        run: git ls-files -z '*.c' '*.h' | xargs -0 clang-format --dry-run --Werror

      - name: SDK du firmware officiel (canal release)
        id: sdk
        run: |
          ufbt update --channel=release
          sdk=$(jq -r .version ~/.ufbt/current/ufbt_state.json)
          api=$(awk -F, '$1 == "Version" { print $3; exit }' \
            ~/.ufbt/current/sdk_headers/f7_sdk/targets/f7/api_symbols.csv)
          echo "sdk-version=$sdk" >> "$GITHUB_OUTPUT"
          echo "api-version=$api" >> "$GITHUB_OUTPUT"
          echo "SDK $sdk, API $api" >> "$GITHUB_STEP_SUMMARY"

      - name: Build du FAP
        run: ufbt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flipper_diver
          path: dist/flipper_diver.fap
          if-no-files-found: error
